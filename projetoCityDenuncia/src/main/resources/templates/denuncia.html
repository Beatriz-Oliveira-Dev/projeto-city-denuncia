<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Denúncia</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(90deg,#2563eb,#06b6d4);
            padding:20px;
        }

        .container{
            width:100%;
            max-width:520px;
        }

        .card{
            background:#f5f5f5;
            border-radius:18px;
            padding:30px;
            box-shadow:0 10px 25px rgba(0,0,0,0.15);
        }

        h1{
            text-align:center;
            color:#2563eb;
            font-size:30px;
            margin-bottom:10px;
        }

        .subtitulo{
            text-align:center;
            color:#555;
            margin-bottom:25px;
            font-size:14px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#222;
            font-size:14px;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:13px;
            border-radius:12px;
            border:1px solid #d1d5db;
            margin-bottom:18px;
            font-size:14px;
        }

        textarea{
            resize:none;
            height:120px;
        }

        .duplo{
            display:flex;
            gap:14px;
        }

        .duplo div{
            flex:1;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
            margin-top:5px;
        }

        button:hover{
            background:#1d4ed8;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Nova Denúncia</h1>

        <p class="subtitulo">
            Informe os detalhes do problema encontrado
        </p>

        <form>

            <label>Título da denúncia</label>
            <input type="text" placeholder="Ex: Buraco na rua">

            <div class="duplo">

                <div>
                    <label>Categoria</label>

                    <select>
                        <option>Selecione</option>
                        <option>Buraco</option>
                        <option>Lixo</option>
                        <option>Iluminação</option>
                        <option>Esgoto</option>
                    </select>
                </div>

                <div>
                    <label>Bairro</label>
                    <input type="text" placeholder="Digite o bairro">
                </div>

            </div>

            <label>Endereço</label>
            <input type="text" placeholder="Rua, número e complemento">

            <label>Descrição</label>

            <textarea placeholder="Descreva o problema encontrado..."></textarea>

            <label>Imagem</label>
            <input type="file">

            <button type="submit">
                Enviar Denúncia
            </button>

        </form>

    </div>

</div>

</body>
</html>
